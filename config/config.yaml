# Runtime parameters — loaded separately from the static manifest and passed
# as Graph(config=...). config/agent.yaml is the static manifest; this file
# holds only what changes at run time.

max_retry: 3
timeout_s: 30
memory_enabled: false
hitl:
  enabled: false
llm_model: claude-3-5-sonnet
temperature: 0.0
max_tokens: 4000
budget_usd: 1.5
provenance_min_quote_len: 8
kb_recall_top_k: 8
kb_raw_retention_days: 365
max_input_bytes: 262144
max_field_chars: 20000
max_bad_char_ratio: 0.1
